<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер Word в Excel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .file-input-wrapper {
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            border: 2px dashed #3498db;
            color: #3498db;
            background-color: #f9fbfd;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .custom-file-upload:hover {
            background-color: #3498db;
            color: #fff;
        }
        .btn-submit {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #27ae60;
        }
        .flash-messages {
            color: #e74c3c;
            margin-bottom: 15px;
            font-size: 14px;
        }
        #file-name {
            margin-top: 10px;
            font-size: 14px;
            color: #7f8c8d;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Word ➔ Excel Конвертер</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="/" method="POST" enctype="multipart/form-data" onsubmit="showLoading()">
        <div class="file-input-wrapper">
            <label class="custom-file-upload">
                <input type="file" name="word_file" accept=".doc,.docx" id="word_file" onchange="updateFileName()">
                Выбрать файл (.doc, .docx)
            </label>
            <div id="file-name">Файл не выбран</div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Конвертировать и скачать</button>
    </form>
</div>

<script>
    // Показывает имя выбранного файла в интерфейсе
    function updateFileName() {
        const input = document.getElementById('word_file');
        const fileNameDiv = document.getElementById('file-name');
        if (input.files.length > 0) {
            fileNameDiv.innerText = "Выбран: " + input.files[0].name;
        } else {
            fileNameDiv.innerText = "Файл не выбран";
        }
    }

    // Небольшой UX-эффект: меняет текст кнопки при отправке формы
    function showLoading() {
        const btn = document.getElementById('submit-btn');
        btn.innerText = "Обработка и скачивание...";
        btn.style.backgroundColor = "#95a5a6";
        btn.style.pointerEvents = "none";
    }
</script>

</body>
</html>
